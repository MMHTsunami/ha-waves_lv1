send_raw_osc:
  name: Send Raw OSC Command
  description: Sends an unformatted or raw custom OSC payload to the Waves LV1.
  fields:
    address:
      name: Address
      description: Target OSC path (e.g., /Set/Track/Mute or /Set/Tempo)
      required: true
      example: "/Set/Track/Mute"
    args_bytes:
      name: Payload Bytes
      description: Encoded binary parameter arguments matching the command signature.
      required: false
      example: "\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x01\x00\x00\x00\x00"
